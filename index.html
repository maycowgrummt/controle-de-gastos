<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlo de Gastos</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400">
                <i class="fa-solid fa-wallet mr-2"></i> Controlo de Gastos
            </h1>
            <p class="text-slate-400 text-sm mt-1">Gestão financeira pessoal simples e direta</p>
        </header>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                <p class="text-sm text-slate-400 font-medium">Receitas Totais</p>
                <p id="totalReceitas" class="text-2xl font-bold text-emerald-400 mt-1">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                <p class="text-sm text-slate-400 font-medium">Despesas Totais</p>
                <p id="totalDespesas" class="text-2xl font-bold text-rose-400 mt-1">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                <p class="text-sm text-slate-400 font-medium">Saldo Atual</p>
                <p id="saldoTotal" class="text-2xl font-bold text-indigo-400 mt-1">R$ 0,00</p>
            </div>
        </div>

        <!-- Formulário de Registo -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Nova Transação</h2>
            <form id="formTransacao" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" id="descricao" placeholder="Descrição (ex: Supermercado)" required
                    class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                
                <input type="number" step="0.01" id="valor" placeholder="Valor (R$)" required
                    class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                
                <input type="date" id="data" required
                    class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                
                <select id="tipo" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="DESPESA">Despesa</option>
                    <option value="RECEITA">Receita</option>
                </select>

                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg px-4 py-2 text-sm transition-colors shadow-md">
                    Adicionar
                </button>
            </form>
        </div>

        <!-- Lista de Transações -->
        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-700">
                <h2 class="text-lg font-semibold text-slate-200">Histórico de Movimentos</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-4">Data</th>
                            <th class="p-4">Descrição</th>
                            <th class="p-4">Tipo</th>
                            <th class="p-4">Valor</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTransacoes" class="divide-y divide-slate-700 text-sm">
                        <!-- Inserido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let transacoes = JSON.parse(localStorage.getItem('transacoes')) || [];

        document.getElementById('data').valueAsDate = new Date();

        const form = document.getElementById('formTransacao');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const novaTransacao = {
                id: Date.now(),
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                data: document.getElementById('data').value,
                tipo: document.getElementById('tipo').value
            };

            transacoes.push(novaTransacao);
            salvarEAtualizar();
            form.reset();
            document.getElementById('data').valueAsDate = new Date();
        });

        function removerTransacao(id) {
            transacoes = transacoes.filter(t => t.id !== id);
            salvarEAtualizar();
        }

        function salvarEAtualizar() {
            localStorage.setItem('transacoes', JSON.stringify(transacoes));
            renderizar();
        }

        function renderizar() {
            const tbody = document.getElementById('tabelaTransacoes');
            tbody.innerHTML = '';

            let receitas = 0;
            let despesas = 0;

            transacoes.forEach(t => {
                if (t.tipo === 'RECEITA') receitas += t.valor;
                else despesas += t.valor;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 text-slate-300">${t.data.split('-').reverse().join('/')}</td>
                    <td class="p-4 font-medium text-slate-100">${t.descricao}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${t.tipo === 'RECEITA' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                            ${t.tipo}
                        </span>
                    </td>
                    <td class="p-4 font-bold ${t.tipo === 'RECEITA' ? 'text-emerald-400' : 'text-rose-400'}">
                        ${t.tipo === 'RECEITA' ? '+ ' : '- '}R$ ${t.valor.toFixed(2)}
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="removerTransacao(${t.id})" class="text-slate-500 hover:text-rose-400 transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const saldo = receitas - despesas;

            document.getElementById('totalReceitas').innerText = `R$ ${receitas.toFixed(2)}`;
            document.getElementById('totalDespesas').innerText = `R$ ${despesas.toFixed(2)}`;
            
            const saldoEl = document.getElementById('saldoTotal');
            saldoEl.innerText = `R$ ${saldo.toFixed(2)}`;
            saldoEl.className = `text-2xl font-bold mt-1 ${saldo >= 0 ? 'text-indigo-400' : 'text-rose-400'}`;
        }

        renderizar();
    </script>
</body>
</html>
