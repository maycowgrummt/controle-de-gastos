<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gerenciar Categorias</h2>
            <a href="/" class="btn btn-secondary">Voltar ao Início</a>
        </div>

        <!-- Formulário para adicionar categoria -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/categorias/salvar" method="post">
                    <div class="input-group">
                        <input type="text" name="nome" class="form-control" placeholder="Nome da nova categoria (ex: Alimentação, Lazer...)" required>
                        <button type="submit" class="btn btn-primary">Adicionar Categoria</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Listagem simples -->
        <div class="card shadow-sm">
            <div class="card-body">
                <ul class="list-group">
                    <li class="list-group-item">Alimentação</li>
                    <li class="list-group-item">Transporte</li>
                    <li class="list-group-item">Moradia</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
